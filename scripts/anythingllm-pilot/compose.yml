name: sfp-anythingllm-pilot

services:
  anythingllm:
    image: mintplexlabs/anythingllm:1.18.0@sha256:a41f36526df988b69672cab15436facdc6f69c4ef782373af0a428e24668b1a5
    platform: linux/amd64
    container_name: sfp-anythingllm-pilot
    ports:
      - "127.0.0.1:18093:3001"
    env_file:
      - ../../tmp/anythingllm-pilot/instance.env
    volumes:
      - ../../tmp/anythingllm-pilot/storage:/app/server/storage
      - ../../tmp/anythingllm-pilot/instance.env:/app/server/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    restart: "no"
