<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f7f8fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

<body class="max-w-[448px] mx-auto pb-[112px] text-gray-800 relative min-h-screen">

    <!-- 顶部操作栏 -->
    <header class="flex justify-end px-[16px] py-[12px] sticky top-0 bg-[#f7f8fa] z-40">
        <div
            class="bg-white/80 backdrop-blur border border-gray-200 rounded-full px-[12px] py-[4px] flex items-center space-x-[12px] shadow-[0_1px_2px_rgba(0,0,0,0.05)]">
            <span class="text-[20px] leading-none">•••</span>
            <div class="w-[1px] h-[16px] bg-gray-200"></div>
            <span class="text-[20px] leading-none">◎</span>
        </div>
    </header>

    <main class="px-[16px] space-y-[16px]">
        <!-- 个人信息卡片 -->
        <section
            class="relative bg-gradient-to-r from-green-50 to-emerald-50 rounded-[16px] p-[16px] overflow-hidden shadow-[0_1px_3px_rgba(0,0,0,0.05)]">
            <!-- 编辑按钮 -->
            <button
                class="absolute top-[12px] right-[12px] bg-white/60 backdrop-blur flex items-center gap-[4px] px-[8px] py-[4px] rounded-[8px] text-[12px] text-gray-600 z-10">
                <svg class="w-[12px] h-[12px]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z">
                    </path>
                </svg>
                编辑
            </button>

            <div class="flex items-center gap-[16px] relative z-10">
                <!-- 头像 -->
                <div
                    class="w-[64px] h-[64px] rounded-full bg-gray-200 border-[2px] border-white shadow-[0_2px_4px_rgba(0,0,0,0.1)] overflow-hidden flex-shrink-0">
                    <img src="https://ui-avatars.com/api/?name=陈&background=e2e8f0&color=64748b" alt="avatar"
                        class="w-full h-full object-cover">
                </div>
                <div>
                    <div class="flex items-center gap-[8px] mb-[4px]">
                        <h2 class="text-[18px] font-bold">陈设计师</h2>
                        <span
                            class="text-[10px] bg-green-100 text-green-600 px-[6px] py-[2px] rounded-[4px] border border-green-200">企业员工</span>
                    </div>
                    <p class="text-[12px] text-gray-500 mb-[4px]">好家装饰设计有限公司</p>
                    <p class="text-[12px] text-gray-500 flex items-center gap-[4px]">
                        <svg class="w-[12px] h-[12px]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z">
                            </path>
                        </svg>
                        138****5678
                    </p>
                </div>
            </div>
            <!-- 右侧装饰 -->
            <div class="absolute right-0 bottom-0 w-[128px] h-[96px] opacity-80 pointer-events-none">
                <div class="w-full h-full bg-green-100/50 rounded-tl-full"></div>
            </div>
        </section>

        <!-- 快捷操作区 -->
        <section
            class="bg-white rounded-[16px] p-[16px] flex justify-between items-center shadow-[0_1px_3px_rgba(0,0,0,0.05)]">
            <!-- 宽度设为 25% 的像素写法 -->
            <div class="flex flex-col items-center gap-[4px] text-center w-[25%]">
                <div class="w-[32px] h-[32px] text-[24px] mb-[4px]">🏢</div>
                <span class="text-[14px] font-medium">报备企业</span>
                <span class="text-[10px] text-gray-400">拓展合作企业</span>
            </div>
            <div class="flex flex-col items-center gap-[4px] text-center w-[25%]">
                <div class="w-[32px] h-[32px] text-[24px] mb-[4px]">⚙️</div>
                <span class="text-[14px] font-medium">我的企业</span>
                <span class="text-[10px] text-gray-400">管理合作企业</span>
            </div>
            <div class="flex flex-col items-center gap-[4px] text-center w-[25%]">
                <div class="w-[32px] h-[32px] text-[24px] mb-[4px]">👥</div>
                <span class="text-[14px] font-medium">公海报备</span>
                <span class="text-[10px] text-gray-400">获取公海客户</span>
            </div>
            <div class="flex flex-col items-center gap-[4px] text-center w-[25%]">
                <div class="w-[32px] h-[32px] text-[24px] mb-[4px]">💼</div>
                <span class="text-[14px] font-medium">我的提成</span>
                <span class="text-[10px] text-gray-400">查看收益明细</span>
            </div>
        </section>

        <!-- 工作看板 -->
        <section class="bg-white rounded-[16px] p-[16px] shadow-[0_1px_3px_rgba(0,0,0,0.05)]">
            <div class="flex justify-between items-center mb-[16px]">
                <h3 class="font-bold text-[16px] text-gray-900">工作看板</h3>
                <span class="text-[12px] text-gray-400 flex items-center">查看全部 <svg class="w-[12px] h-[12px] ml-[2px]"
                        fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg></span>
            </div>
            <div class="grid grid-cols-4 gap-[8px]">
                <div class="bg-green-50/50 rounded-[12px] p-[8px] text-center flex flex-col items-center">
                    <div class="flex items-center gap-[4px] text-[12px] text-gray-600 mb-[8px]"><span
                            class="text-green-500">🏠</span> 待量房</div>
                    <div class="text-[20px] font-bold">12<span
                            class="text-[10px] font-normal text-gray-400 ml-[2px]">个</span></div>
                    <div class="text-[10px] text-gray-400 mt-[4px]">较昨日 <span class="text-green-500">+3</span></div>
                </div>
                <div class="bg-green-50/50 rounded-[12px] p-[8px] text-center flex flex-col items-center">
                    <div class="flex items-center gap-[4px] text-[12px] text-gray-600 mb-[8px]"><span
                            class="text-green-500">✏️</span> 待设计</div>
                    <div class="text-[20px] font-bold">8<span
                            class="text-[10px] font-normal text-gray-400 ml-[2px]">个</span></div>
                    <div class="text-[10px] text-gray-400 mt-[4px]">较昨日 <span class="text-green-500">+1</span></div>
                </div>
                <div class="bg-green-50/50 rounded-[12px] p-[8px] text-center flex flex-col items-center">
                    <div class="flex items-center gap-[4px] text-[12px] text-gray-600 mb-[8px]"><span
                            class="text-green-500">🤝</span> 本月成交</div>
                    <div class="text-[20px] font-bold">6<span
                            class="text-[10px] font-normal text-gray-400 ml-[2px]">单</span></div>
                    <div class="text-[10px] text-gray-400 mt-[4px]">较上月 <span class="text-green-500">+2</span></div>
                </div>
                <div class="bg-green-50/50 rounded-[12px] p-[8px] text-center flex flex-col items-center">
                    <div class="flex items-center gap-[4px] text-[12px] text-gray-600 mb-[8px]"><span
                            class="text-green-500">👤</span> 服务客户</div>
                    <div class="text-[20px] font-bold">36<span
                            class="text-[10px] font-normal text-gray-400 ml-[2px]">位</span></div>
                    <div class="text-[10px] text-gray-400 mt-[4px]">较上月 <span class="text-green-500">+8</span></div>
                </div>
            </div>
        </section>

        <!-- 我的待办 -->
        <section class="bg-white rounded-[16px] p-[16px] shadow-[0_1px_3px_rgba(0,0,0,0.05)]">
            <div class="flex justify-between items-center mb-[8px]">
                <h3 class="font-bold text-[16px] text-gray-900">我的待办</h3>
                <span class="text-[12px] text-gray-400 flex items-center">查看全部 <svg class="w-[12px] h-[12px] ml-[2px]"
                        fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg></span>
            </div>

            <div class="divide-y divide-gray-50">
                <!-- 待办项目 -->
                <div class="py-[12px] flex items-center gap-[12px]">
                    <div
                        class="w-[40px] h-[40px] rounded-full bg-green-100 text-[18px] flex items-center justify-center flex-shrink-0">
                        📅</div>
                    <div class="flex-1 min-w-0">
                        <h4 class="text-[14px] font-bold text-gray-800">量房预约</h4>
                        <p class="text-[12px] text-gray-400 truncate mt-[2px]">浦东陆家嘴滨江 · 张女士</p>
                        <p class="text-[10px] text-gray-400 mt-[2px] flex items-center gap-[4px]">🕒 今天 10:00</p>
                    </div>
                    <div class="flex items-center gap-[8px]">
                        <span
                            class="text-[10px] bg-green-50 text-green-500 px-[8px] py-[2px] rounded-full border border-green-100">待量房</span>
                        <svg class="w-[16px] h-[16px] text-gray-300" fill="none" stroke="currentColor"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7">
                            </path>
                        </svg>
                    </div>
                </div>
                <!-- 更多待办... (结构相同，高度像素化) -->
            </div>
        </section>

        <!-- 退出登录 -->
        <button
            class="w-full bg-gray-100 text-gray-600 text-[14px] py-[12px] rounded-full flex items-center justify-center gap-[8px]">
            <svg class="w-[16px] h-[16px]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path>
            </svg>
            切换账号 / 退出登录
        </button>
    </main>

    <!-- 底部导航栏 -->
    <footer
        class="fixed bottom-0 left-0 right-0 max-w-[448px] mx-auto bg-white shadow-[0_-2px_10px_rgba(0,0,0,0.05)] flex justify-around items-end pb-[24px] pt-[8px] z-50">
        <div class="flex flex-col items-center gap-[4px] w-[20%] text-gray-400">
            <span class="text-[20px]">🏠</span>
            <span class="text-[10px]">首页</span>
        </div>
        <div class="flex flex-col items-center gap-[4px] w-[20%] text-gray-400">
            <span class="text-[20px]">👥</span>
            <span class="text-[10px]">线索</span>
        </div>

        <!-- 悬浮按钮 -->
        <div class="relative w-[20%] flex justify-center">
            <div
                class="absolute -top-[32px] w-[56px] h-[56px] bg-green-500 rounded-full border-[4px] border-white flex flex-col items-center justify-center shadow-[0_4px_12px_rgba(34,197,94,0.3)] text-white">
                <span class="text-[20px] mb-[2px]">📏</span>
                <span class="text-[8px]">量房</span>
            </div>
        </div>

        <div class="flex flex-col items-center gap-[4px] w-[20%] text-gray-400">
            <span class="text-[20px]">💡</span>
            <span class="text-[10px]">灵感</span>
        </div>
        <div class="flex flex-col items-center gap-[4px] w-[20%] text-green-500">
            <span class="text-[20px]">👤</span>
            <span class="text-[10px] font-medium">我的</span>
        </div>
        <!-- 底部指示条 -->
        <div class="absolute bottom-[6px] left-1/2 -translate-x-1/2 w-[134px] h-[4px] bg-gray-300 rounded-full"></div>
    </footer>

</body>

</html>
