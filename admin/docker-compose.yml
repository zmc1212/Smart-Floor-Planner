services:
  admin:
    image: ${SFP_ADMIN_IMAGE:-zmc1212/sfp-admin:latest}
    build: .
    container_name: smart-floor-planner-admin
    restart: unless-stopped
    ports:
      - "3005:3005"
    env_file:
      - ${SFP_RUNTIME_ENV_FILE:-.env.production}
    environment:
      # Production Node also blocks tenant reset/purge unless
      # ALLOW_TENANT_ENTERPRISE_RESET=true is present in .env.production.
      - NODE_ENV=production
      # Defaults to false for trusted-intranet HTTP. deploy.sh reads the value
      # from .env.production, so set it to true before serving HTTPS/public traffic.
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-false}
      - MEDIA_STORAGE_PROVIDER=local
      - AI_ASSET_STORAGE_DIR=/data/ai-assets
      # Development fallback only. Production must provide DATABASE_URL via the
      # runtime env file; deploy.sh rejects the local-only default password.
      - DATABASE_URL=${DATABASE_URL:-postgresql://sfp_app:sfp_app_local_only@postgres:5432/smart_floor_planner}
      - ASSISTANT_WORKER_HEALTH_FILE=/shared/assistant-worker-health.json
      - POSTGRES_HEALTHCHECK_REQUIRED=true
    volumes:
      - ai_assets:/data/ai-assets
      - assistant_health:/shared
    networks:
      - default
      # WVP/ZLM live on their own Compose network; camera live/snapshot/
      # playback calls resolve them by service name from there.
      - camera
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    image: ${SFP_ADMIN_IMAGE:-zmc1212/sfp-admin:latest}
    profiles: ["migration"]
    restart: "no"
    environment:
      - NODE_ENV=production
      # Development fallback only; production must override this value.
      - DATABASE_MIGRATION_URL=${DATABASE_MIGRATION_URL:-postgresql://sfp_migrator:sfp_migrator_local_only@postgres:5432/smart_floor_planner}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "scripts/postgres-migrate.mjs"]

  lead-claim-worker:
    image: ${SFP_ADMIN_IMAGE:-zmc1212/sfp-admin:latest}
    build: .
    container_name: smart-floor-planner-lead-claim-worker
    restart: unless-stopped
    env_file:
      - ${SFP_RUNTIME_ENV_FILE:-.env.production}
    environment:
      - NODE_ENV=production
      - LEAD_CLAIM_WORKER_ENDPOINT=http://admin:3005/api/internal/lead-claim-windows/run
    depends_on:
      - admin
    command: ["node", "scripts/lead-claim-worker.mjs"]
    healthcheck:
      test: ["CMD", "node", "scripts/lead-claim-worker-healthcheck.mjs"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  assistant-worker:
    image: ${SFP_ADMIN_IMAGE:-zmc1212/sfp-admin:latest}
    build: .
    profiles: ["assistant"]
    restart: unless-stopped
    env_file:
      - ${SFP_RUNTIME_ENV_FILE:-.env.production}
    environment:
      - NODE_ENV=production
      - ASSISTANT_WORKER_ENDPOINT=http://admin:3005/api/internal/assistant/jobs/run
      - ASSISTANT_WORKER_HEALTH_FILE=/shared/assistant-worker-health.json
    depends_on:
      - admin
    volumes:
      - assistant_health:/shared
    command: ["node", "scripts/assistant-worker.mjs"]
    healthcheck:
      test: ["CMD", "node", "scripts/assistant-worker-healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    # pgvector build is required: the schema installs the `vector` extension and
    # dumps/migrations fail on plain postgres images without $libdir/vector.
    image: ${SFP_POSTGRES_IMAGE:-pgvector/pgvector:0.8.2-pg17}
    container_name: smart-floor-planner-postgres
    restart: unless-stopped
    ports:
      # Keep host-side maintenance access local; application containers use the
      # private Compose network and production must never publish PostgreSQL.
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: sfp_owner
      # Development fallback only; production must provide POSTGRES_PASSWORD or
      # use an external managed database.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sfp_owner_local_only}
      POSTGRES_DB: smart_floor_planner
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sfp_owner -d smart_floor_planner"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  ai_assets:
  assistant_health:
  postgres_data:

networks:
  camera:
    # The WVP Compose project already owns this network. Override the name when
    # the WVP project is deployed under a different name or to another host.
    external: true
    name: ${SFP_CAMERA_NETWORK:-sfp-wvp-cloud_default}
