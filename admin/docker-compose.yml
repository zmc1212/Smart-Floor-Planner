services:
  admin:
    image: zmc1212/sfp-admin:latest
    container_name: smart-floor-planner-admin
    restart: unless-stopped
    ports:
      - "3005:3005"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - INTERNAL_SECRET=sfp_internal_init_secret_2024
      - MEDIA_STORAGE_PROVIDER=local
      - AI_ASSET_STORAGE_DIR=/data/ai-assets
    volumes:
      - ai_assets:/data/ai-assets

  mongo:
    image: mongo:7
    container_name: smart-floor-planner-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: 123456
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
  ai_assets:
