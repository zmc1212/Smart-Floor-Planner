services:
  admin:
    image: ${SFP_ADMIN_IMAGE:-zmc1212/sfp-admin:latest}
    build: .
    container_name: smart-floor-planner-admin
    restart: unless-stopped
    ports:
      - "3005:3005"
    env_file:
      - ${SFP_RUNTIME_ENV_FILE:-.env.production}
    environment:
      # Production Node also blocks tenant reset/purge unless
      # ALLOW_TENANT_ENTERPRISE_RESET=true is present in .env.production.
      - NODE_ENV=production
      # Defaults to false for trusted-intranet HTTP. deploy.sh reads the value
      # from .env.production, so set it to true before serving HTTPS/public traffic.
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-false}
      - MEDIA_STORAGE_PROVIDER=local
      - AI_ASSET_STORAGE_DIR=/data/ai-assets
      - DATABASE_URL=postgresql://sfp_app:sfp_app_local_only@postgres:5432/smart_floor_planner
      - POSTGRES_HEALTHCHECK_REQUIRED=true
    volumes:
      - ai_assets:/data/ai-assets
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    image: ${SFP_ADMIN_IMAGE:-zmc1212/sfp-admin:latest}
    profiles: ["migration"]
    restart: "no"
    environment:
      - NODE_ENV=production
      - DATABASE_MIGRATION_URL=postgresql://sfp_migrator:sfp_migrator_local_only@postgres:5432/smart_floor_planner
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "scripts/postgres-migrate.mjs"]

  lead-claim-worker:
    image: ${SFP_ADMIN_IMAGE:-zmc1212/sfp-admin:latest}
    build: .
    container_name: smart-floor-planner-lead-claim-worker
    restart: unless-stopped
    env_file:
      - ${SFP_RUNTIME_ENV_FILE:-.env.production}
    environment:
      - NODE_ENV=production
      - LEAD_CLAIM_WORKER_ENDPOINT=http://admin:3005/api/internal/lead-claim-windows/run
    depends_on:
      - admin
    command: ["node", "scripts/lead-claim-worker.mjs"]
    healthcheck:
      test: ["CMD", "node", "scripts/lead-claim-worker-healthcheck.mjs"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  postgres:
    image: postgres:17
    container_name: smart-floor-planner-postgres
    restart: unless-stopped
    ports:
      # Keep host-side maintenance access local; application containers use the
      # private Compose network and production must never publish PostgreSQL.
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: sfp_owner
      POSTGRES_PASSWORD: sfp_owner_local_only
      POSTGRES_DB: smart_floor_planner
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sfp_owner -d smart_floor_planner"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  ai_assets:
  postgres_data:
