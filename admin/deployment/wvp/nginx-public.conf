# Authorized standalone WVP management ingress for the current server.
# Install separately from frozen release001; upstream ports stay loopback-only.
map $http_upgrade $sfp_wvp_connection_upgrade {
    default upgrade;
    '' close;
}

# WVP's native login uses a password digest in its query string.
# Exclude query arguments, cookies and bearer headers from this site's access log.
log_format sfp_wvp_noargs '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent';

server {
    listen 80;
    listen [::]:80;
    server_name wvp.zlyun168.com;
    access_log /var/log/nginx/sfp-wvp-access.log sfp_wvp_noargs;
    return 301 https://wvp.zlyun168.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wvp.zlyun168.com;

    ssl_certificate /etc/letsencrypt/live/zlyun168.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zlyun168.com/privkey.pem;
    ssl_protocols TLSv1.2;

    access_log /var/log/nginx/sfp-wvp-access.log sfp_wvp_noargs;
    # Avoid writing credential-bearing login queries during upstream errors.
    error_log /var/log/nginx/sfp-wvp-error.log crit;
    client_max_body_size 16m;

    # Reuse WVP's real JWT session. Its bundled UI stores this exact cookie.
    # The native RTP on_play hook permits RTP viewers without login, so it is
    # insufficient by itself for a private camera exposed through HTTPS.
    location = /_sfp_wvp_session {
        internal;
        proxy_pass http://127.0.0.1:28080/api/device/query/devices?page=1&count=1;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header access-token $cookie_wvp_token;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /rtp/ {
        auth_request /_sfp_wvp_session;
        proxy_pass http://127.0.0.1:28081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $sfp_wvp_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ ^/(snap|record)/ {
        auth_request /_sfp_wvp_session;
        proxy_pass http://127.0.0.1:28081;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # ZLM control APIs and WVP internal hooks are not public management routes.
    location ^~ /index/ { return 404; }
    location = /doc.html { return 404; }
    location ^~ /v3/api-docs { return 404; }
    location ^~ /swagger-ui { return 404; }
    location ^~ /swagger-resources { return 404; }

    location / {
        proxy_pass http://127.0.0.1:28080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $sfp_wvp_connection_upgrade;
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 300s;

        # Preserve the frozen app and native player; publish its returned media
        # URLs through this same authenticated HTTPS/WSS origin.
        sub_filter_types application/json;
        sub_filter_once off;
        sub_filter 'http://127.0.0.1:28081' 'https://wvp.zlyun168.com';
        sub_filter 'ws://127.0.0.1:28081' 'wss://wvp.zlyun168.com';

        # Frozen WVP2.7.4 returns null TLS fields when ZLM uses HTTP behind an
        # HTTPS terminator. Its HTTPS UI selects those fields. Move the generated
        # URLs to their TLS counterparts and keep the unsupported cleartext
        # counterparts null. Replacement text is not filtered recursively.
        sub_filter '"https_flv":null' '"flv":null';
        sub_filter '"flv":' '"https_flv":';
        sub_filter '"wss_flv":null' '"ws_flv":null';
        sub_filter '"ws_flv":' '"wss_flv":';
        sub_filter '"https_fmp4":null' '"fmp4":null';
        sub_filter '"fmp4":' '"https_fmp4":';
        sub_filter '"wss_fmp4":null' '"ws_fmp4":null';
        sub_filter '"ws_fmp4":' '"wss_fmp4":';
        sub_filter '"https_hls":null' '"hls":null';
        sub_filter '"hls":' '"https_hls":';
        sub_filter '"wss_hls":null' '"ws_hls":null';
        sub_filter '"ws_hls":' '"wss_hls":';
        sub_filter '"https_ts":null' '"ts":null';
        sub_filter '"ts":' '"https_ts":';
        sub_filter '"wss_ts":null' '"ws_ts":null';
        sub_filter '"ws_ts":' '"wss_ts":';
    }
}
