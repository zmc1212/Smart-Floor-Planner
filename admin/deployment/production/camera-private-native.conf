location ~ "^/api/miniprogram/construction/(?:video/projects/[1-9][0-9]{0,18}/native-live/(?:start|heartbeat|stop)|staff-video/projects/[1-9][0-9]{0,18}/(?:cameras|entry|native-live/(?:start|heartbeat|stop)))$" {
    proxy_pass http://127.0.0.1:33418;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 32k;
    proxy_buffering off;
    proxy_read_timeout 90s;
}

location ^~ /camera-media/native/ {
    proxy_pass http://127.0.0.1:33418;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 90s;
    access_log off;
}
