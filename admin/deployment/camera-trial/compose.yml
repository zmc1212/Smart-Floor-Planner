services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17@sha256:feb68f4f15446397d8cac7f4fe48fe4586de83160d1fc48b46283312d1a33966
    container_name: sfp-camera-trial-postgres-20261106
    restart: unless-stopped
    env_file: .env.postgres
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      trial:
        ipv4_address: 10.203.207.3
    mem_limit: 384m
    cpus: 1
    pids_limit: 128
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U sfp_owner -d camera_trial']
      interval: 5s
      timeout: 3s
      retries: 12
  gateway:
    image: sfp-camera-trial:20261106-001
    container_name: sfp-camera-trial-gateway-20261106
    restart: unless-stopped
    env_file: .env.app
    read_only: true
    tmpfs:
      - /tmp:size=67108864,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      trial:
        ipv4_address: 10.203.207.2
      media: {}
    mem_limit: 768m
    cpus: 1
    pids_limit: 128
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://10.203.207.2:33417/camera-gateway-health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 10s
      timeout: 3s
      retries: 6
networks:
  trial:
    ipam:
      config:
        - subnet: 10.203.207.0/24
  media:
    external: true
    name: sfp-wvp-cloud_default
