# Include only inside smartfloor.zlyun168.com's existing HTTPS server.
# All other business routes keep the formal Admin upstream.
location ^~ /camera-test-api/ {
    rewrite ^/camera-test-api/(.*)$ /api/$1 break;
    proxy_pass http://10.203.207.2:33417;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 32k;
    proxy_buffering off;
    proxy_read_timeout 90s;
}
location = /construction-camera {
    proxy_pass http://10.203.207.2:33417;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}
location ^~ /construction-camera/ {
    proxy_pass http://10.203.207.2:33417;
    proxy_set_header Host $host;
}
location ^~ /api/construction-camera/ {
    proxy_pass http://10.203.207.2:33417;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 32k;
    proxy_buffering off;
    proxy_read_timeout 90s;
}
location ^~ /camera-media/ {
    proxy_pass http://10.203.207.2:33417;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 900s;
}
location ^~ /camera-recording/ {
    proxy_pass http://10.203.207.2:33417;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 90s;
}
