use_default_settings:
  engines:
    keep_only: [sogou, 360search]
engines:
  - name: sogou
    disabled: false
    timeout: 8.0
  - name: 360search
    disabled: false
    timeout: 8.0
general:
  instance_name: XiaoK Development Search
server:
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: false
  secret_key: "REPLACE_DURING_INSTALL"
search:
  formats: [json]
  default_lang: zh-CN
  safe_search: 1
outgoing:
  request_timeout: 8.0
  max_request_timeout: 10.0
  retries: 0
