<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>工地视频</title><link rel="stylesheet" href="/construction-camera/style.css"><script src="/construction-camera/vendor/mpegts-1.8.2.js" defer></script><script src="/construction-camera/vendor/hls-1.6.13.js" defer></script><script src="/construction-camera/player.js" defer></script></head>
<body><div class="book-spine" aria-hidden="true"></div><main>
  <header><span class="eyebrow sr-only">云工地 · 实时画面</span><h1 id="project">工地视频</h1></header>
  <section class="player-section"><div class="camera-row"><div class="camera-choice"><label for="camera" class="sr-only">摄像头</label><select id="camera" disabled><option>正在读取摄像头…</option></select></div><details id="live-settings"><summary>播放设置</summary><div class="settings-panel"><label for="mode">播放方式</label><select id="mode"><option value="auto">自动选择</option><option value="flv">低延迟直播</option><option value="hls">兼容播放</option></select><p class="hint">默认静音，可用画面控件开启声音或全屏。</p></div></details></div>
    <div class="mode-tabs" role="group" aria-label="观看内容"><button id="live-tab" aria-pressed="true">直播</button><button id="playback-tab" class="secondary" aria-pressed="false">回放</button></div>
    <div class="video-mat"><video id="video" controls playsinline webkit-playsinline x5-playsinline muted disableremoteplayback preload="none"></video></div>
    <p id="status" role="status" aria-live="polite">正在核对访问权限…</p>
    <div id="live-actions" class="actions"><button id="play" disabled>开始播放</button><button id="stop" class="secondary" disabled>停止播放</button></div>
    <div id="camera-tools" class="camera-tools" hidden><button id="capture" hidden disabled><img src="/construction-camera/assets/camera.png" alt="">抓拍</button><button id="history-jump" hidden><img src="/construction-camera/assets/image.png" alt="">抓拍记录</button><button id="ptz-toggle" hidden><img src="/construction-camera/assets/move.png" alt="">云台控制</button></div>
    <div id="playback-panel" hidden><div class="date-row"><label for="recording-date" class="sr-only">录像日期</label><input id="recording-date" type="date"><button id="query-recordings" class="secondary">查询</button></div><div class="paper recording-paper"><h2>可看录像</h2><p id="recording-source" class="hint"></p><label for="recording" class="sr-only">录像片段</label><select id="recording" class="sr-only" disabled><option>请选择日期查询</option></select><div id="recording-list" class="recording-list" role="group" aria-label="可看录像片段"></div><p id="recording-status" class="hint" role="status" aria-live="polite">仅显示实际保存且未过期的录像；中断期间可能存在缺口。</p></div><div class="playback-actions"><button id="play-recording" disabled>播放所选片段</button><button id="return-live" class="text-button">返回直播</button></div></div>
  </section>
  <details id="ptz" class="paper" hidden><summary>云台控制</summary><p class="hint">轻点调整方向，每次短暂移动后自动停止。</p><div class="ptz-grid"><button data-direction="up" class="up" aria-label="向上"><img src="/construction-camera/assets/up.png" alt=""></button><button data-direction="left" class="left" aria-label="向左"><img src="/construction-camera/assets/left.png" alt=""></button><button data-direction="stop" class="secondary center">停止</button><button data-direction="right" class="right" aria-label="向右"><img src="/construction-camera/assets/right.png" alt=""></button><button data-direction="down" class="down" aria-label="向下"><img src="/construction-camera/assets/down.png" alt=""></button></div></details>
  <section id="snapshots-section" class="paper"><div class="section-heading"><h2 class="fabric">抓拍记录</h2><button id="refresh" class="text-button" disabled>刷新</button></div><p id="history-status" class="hint">正在读取…</p><div id="history" class="history"></div><p class="hint history-foot">保留期内可查看</p></section>
  <p class="hint footer">现场画面仅供获授权的工地成员查看。</p>
</main><dialog id="preview"><button id="close-preview" class="secondary">关闭图片</button><img id="preview-image" alt="工地抓拍大图"></dialog></body></html>
