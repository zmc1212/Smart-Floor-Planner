<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>工地实时画面</title><link rel="stylesheet" href="/construction-camera/style.css"><script src="/construction-camera/vendor/mpegts-1.8.2.js" defer></script><script src="/construction-camera/vendor/hls-1.6.13.js" defer></script><script src="/construction-camera/player.js" defer></script></head>
<body><main>
  <header><span class="eyebrow">云工地 · 实时画面</span><h1 id="project">工地摄像头</h1><p class="hint">查看现场，随时掌握施工进展</p></header>
  <section class="player-section"><label for="camera">摄像头</label><select id="camera" disabled><option>正在读取摄像头…</option></select>
    <video id="video" controls playsinline webkit-playsinline x5-playsinline muted disableremoteplayback preload="none"></video>
    <p id="status" role="status" aria-live="polite">正在核对访问权限…</p>
    <div class="actions"><button id="play" disabled>开始播放</button><button id="stop" class="secondary" disabled>停止播放</button><button id="capture" class="secondary" hidden disabled>抓拍</button></div>
    <details><summary>播放设置</summary><label for="mode">播放方式</label><select id="mode"><option value="auto">自动选择</option><option value="flv">低延迟直播</option><option value="hls">兼容播放</option></select><p class="hint">默认静音，可用画面上的控件开启声音或全屏。</p></details>
  </section>
  <section id="ptz" hidden><h2>云台控制</h2><p class="hint">轻点调整方向，每次短暂移动后自动停止。</p><div class="ptz-grid"><button data-direction="up" class="up" aria-label="向上">↑</button><button data-direction="left" class="left" aria-label="向左">←</button><button data-direction="stop" class="secondary center">停止</button><button data-direction="right" class="right" aria-label="向右">→</button><button data-direction="down" class="down" aria-label="向下">↓</button></div></section>
  <section><div class="section-heading"><h2>抓拍记录</h2><button id="refresh" class="text-button" disabled>刷新</button></div><p id="history-status" class="hint">正在读取…</p><div id="history" class="history"></div></section>
  <p class="hint footer">现场画面仅供获授权的工地成员查看。</p>
</main><dialog id="preview"><button id="close-preview" class="secondary">关闭图片</button><img id="preview-image" alt="工地抓拍大图"></dialog></body></html>
