              <div data-hf-id="hf-vzm7" class="f04-designer-hotspot" id="04-designer-target-leads" style="left: 5.86%; top: 32.55%; width: 42.97%; height: 9.11%"></div>
              <div data-hf-id="hf-p5pw" class="f04-designer-hotspot" id="04-designer-target-recipes" style="left: 51.17%; top: 32.55%; width: 42.19%; height: 9.11%"></div>
              <div data-hf-id="hf-2rtf" class="f04-designer-hotspot" id="04-designer-target-pair" style="left: 6.25%; top: 81.77%; width: 82.03%; height: 8.85%"></div>

  <script>
    (async () => {
      await document.fonts.ready;

      const plate = document.getElementById("04-designer-phone");
      const outer = document.getElementById("04-designer-zoom-outer");
      const inner = document.getElementById("04-designer-zoom-inner");
      const pressStage = document.getElementById("04-designer-target-cta");
      const btn = document.getElementById("04-designer-btn");
      const burst = document.getElementById("04-designer-burst");
      const glow = document.getElementById("04-designer-glow");
      const hl1 = document.getElementById("04-designer-hl1");
      const hl2 = document.getElementById("04-designer-hl2");
      const hl3 = document.getElementById("04-designer-hl3");
      const hl4 = document.getElementById("04-designer-hl4");
      const hl5 = document.getElementById("04-designer-hl5");
      const eyebrow = document.getElementById("04-designer-eyebrow");

      const plateR = plate.getBoundingClientRect();
      const pCx = plateR.left + plateR.width / 2;
      const pCy = plateR.top + plateR.height / 2;
      const viewW = plateR.width;
      const viewH = plateR.height;

      const measure = (el, desired) => {
        const r = el.getBoundingClientRect();
        const maxScale = Math.min((0.88 * viewW) / r.width, (0.88 * viewH) / r.height);
        return {
          ox: r.left + r.width / 2 - pCx,
          oy: r.top + r.height / 2 - pCy,
          scale: Math.min(desired, maxScale),
        };
      };

      const hero = measure(document.getElementById("04-designer-target-hero"), 1.05);
      const leads = measure(document.getElementById("04-designer-target-leads"), 2.2);
      const recipes = measure(document.getElementById("04-designer-target-recipes"), 2.2);
      const pair = measure(document.getElementById("04-designer-target-pair"), 1.6);
      const cta = measure(pressStage, 2.8);

      const restShadow = "0 8px 24px rgba(0, 195, 101, 0.35)";
      const pressedShadow = "0 2px 8px rgba(0, 195, 101, 0.2)";

      const tl = gsap.timeline({ paused: true });

      const later = { immediateRender: false };

      const cam = (from, to, at, dur) => {
        tl.fromTo(
          outer,
          { scale: from.scale },
          { scale: to.scale, duration: dur, ease: "power3.inOut", ...later },
          at,
        );
        tl.fromTo(
          inner,
          { x: -from.ox, y: -from.oy },
          { x: -to.ox, y: -to.oy, duration: dur, ease: "power3.inOut", ...later },
          at,
        );
      };

      const zoomThrough = (outgoing, incoming, cutAt) => {
        tl.fromTo(
          outgoing,
          { scale: 1, filter: "blur(0px)" },
          { scale: 1.2, filter: "blur(10px)", duration: 0.2, ease: "power3.in", ...later },
          cutAt - 0.2,
        );
        tl.fromTo(
          outgoing,
          { opacity: 1 },
          { opacity: 0.15, duration: 0.2, ease: "none", ...later },
          cutAt - 0.2,
        );
        tl.fromTo(
          outgoing,
          { opacity: 0.15 },
          { opacity: 0, duration: 0.001, ease: "power3.out", ...later },
          cutAt,
        );
        tl.fromTo(
          incoming,
          { scale: 0.75, filter: "blur(10px)", opacity: 0.15 },
          { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.5, ease: "power3.out", ...later },
          cutAt,
        );
      };

      const inverseZoom = (outgoing, incoming, cutAt) => {
        tl.fromTo(
          outgoing,
          { scale: 1, filter: "blur(0px)" },
          { scale: 0.8, filter: "blur(10px)", duration: 0.2, ease: "power3.in", ...later },
          cutAt - 0.2,
        );
        tl.fromTo(
          outgoing,
          { opacity: 1 },
          { opacity: 0.15, duration: 0.2, ease: "none", ...later },
          cutAt - 0.2,
        );
        tl.fromTo(
          outgoing,
          { opacity: 0.15 },
          { opacity: 0, duration: 0.001, ease: "power3.out", ...later },
          cutAt,
        );
        tl.fromTo(
          incoming,
          { scale: 1.25, filter: "blur(10px)", opacity: 0.15 },
          { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.5, ease: "power3.out", ...later },
          cutAt,
        );
      };

      tl.fromTo(
        plate,
        { scale: 0, opacity: 0, y: 24 },
        { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        0,
      );
      tl.fromTo(
        eyebrow,
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        0,
      );
      tl.fromTo(
        hl1,
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.06,
      );
      tl.fromTo(hl2, { opacity: 0, scale: 1 }, { opacity: 0, scale: 1, duration: 0.001, ease: "power3.out" }, 0);
      tl.fromTo(hl3, { opacity: 0, scale: 1 }, { opacity: 0, scale: 1, duration: 0.001, ease: "power3.out" }, 0);
      tl.fromTo(hl4, { opacity: 0, scale: 1 }, { opacity: 0, scale: 1, duration: 0.001, ease: "power3.out" }, 0);
      tl.fromTo(hl5, { opacity: 0, scale: 1 }, { opacity: 0, scale: 1, duration: 0.001, ease: "power3.out" }, 0);
      tl.fromTo(btn, { opacity: 0, scale: 1 }, { opacity: 0, scale: 1, duration: 0.001, ease: "power3.out" }, 0);
      tl.fromTo(burst, { opacity: 0, scale: 1 }, { opacity: 0, scale: 1, duration: 0.001, ease: "power3.out" }, 0);
      tl.fromTo(glow, { opacity: 0 }, { opacity: 0, duration: 0.001, ease: "power3.out" }, 0);

      tl.fromTo(
        outer,
        { scale: 1 },
        { scale: hero.scale, duration: 1.5, ease: "power3.inOut" },
        0.7,
      );
      tl.fromTo(
        inner,
        { x: 0, y: 0 },
        { x: -hero.ox, y: -hero.oy, duration: 1.5, ease: "power3.inOut" },
        0.7,
      );

      zoomThrough(hl1, hl2, 3.2);
      cam(hero, leads, 3.2, 1.2);

      zoomThrough(hl2, hl3, 5.4);
      cam(leads, recipes, 5.4, 0.95);

      zoomThrough(hl3, hl4, 6.55);
      cam(recipes, pair, 6.55, 1.0);

      inverseZoom(hl4, hl5, 7.8);
      cam(pair, cta, 7.8, 0.9);

      tl.fromTo(
        btn,
        { opacity: 0, scale: 0.9 },
        { opacity: 1, scale: 1, duration: 0.2, ease: "power3.out", ...later },
        8.55,
      );

      const PRESS_START = 8.75;
      const PRESS_DUR = 0.16;
      const RELEASE_START = PRESS_START + PRESS_DUR;
      tl.fromTo(
        btn,
        { scale: 1, boxShadow: restShadow },
        { scale: 0.92, boxShadow: pressedShadow, duration: PRESS_DUR, ease: "power1.in", ...later },
        PRESS_START,
      );
      tl.fromTo(
        btn,
        { scale: 0.92, boxShadow: pressedShadow },
        { scale: 1, boxShadow: restShadow, duration: 0.54, ease: "back.out(2)", ...later },
        RELEASE_START,
      );
      tl.fromTo(
        burst,
        { scale: 1, opacity: 0 },
        { scale: 6, opacity: 0.7, duration: 0.45, ease: "power3.out", ...later },
        RELEASE_START,
      );
      tl.fromTo(
        burst,
        { opacity: 0.7 },
        { opacity: 0, duration: 0.45, ease: "power3.in", ...later },
        RELEASE_START + 0.45,
      );
      tl.fromTo(
        glow,
        { opacity: 0 },
        { opacity: 0.25, duration: 0.7, ease: "power3.out", ...later },
        RELEASE_START,
      );

      const IDLE_START = RELEASE_START;
      const IDLE_DUR = 9.912 - IDLE_START;
      const CYCLES = 0.5;
      tl.fromTo(
        pressStage,
        { y: 0 },
        {
          y: 3,
          duration: IDLE_DUR,
          ease: (p) => Math.sin(p * Math.PI * 2 * CYCLES),
          ...later,
        },
        IDLE_START,
      );

      window.__timelines["04-designer"] = tl;
      if (typeof window.__hfForceTimelineRebind === "function") {
        window.__hfForceTimelineRebind();
      }
    })();
  </script>
