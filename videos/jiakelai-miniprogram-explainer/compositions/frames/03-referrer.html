    void (async function () {
      const shot = document.getElementById("03-referrer-shot");
      await document.fonts.ready;
      if (shot && shot.decode) {
        try {
          await shot.decode();
        } catch (err) {}
      }

      const eyebrow = document.getElementById("03-referrer-eyebrow");
      const headline = document.getElementById("03-referrer-headline");
      const plate = document.getElementById("03-referrer-plate");
      const outer = document.getElementById("03-referrer-zoom-outer");
      const inner = document.getElementById("03-referrer-zoom-inner");
      const hero = document.getElementById("03-referrer-hero");
      const cta = document.getElementById("03-referrer-cta");
      const progress = document.getElementById("03-referrer-progress");
      const earnings = document.getElementById("03-referrer-earnings");
      const press = document.getElementById("03-referrer-press");
      const burst = document.getElementById("03-referrer-burst");
      const label1 = document.getElementById("03-referrer-label-1");
      const label2 = document.getElementById("03-referrer-label-2");
      const label3 = document.getElementById("03-referrer-label-3");
      const label4 = document.getElementById("03-referrer-label-4");

      function measure(el) {
        const view = plate.getBoundingClientRect();
        const r = el.getBoundingClientRect();
        return {
          x: r.left + r.width / 2 - (view.left + view.width / 2),
          y: r.top + r.height / 2 - (view.top + view.height / 2),
          w: r.width,
          h: r.height,
          vw: view.width,
          vh: view.height,
        };
      }

      function capScale(desired, m) {
        return Math.min(desired, (0.88 * m.vw) / m.w, (0.88 * m.vh) / m.h);
      }

      const heroM = measure(hero);
      const ctaM = measure(cta);
      const progressM = measure(progress);
      const earningsM = measure(earnings);

      const sHero = capScale(1.34, heroM);
      const sCta = capScale(2.08, ctaM);
      const sProgress = capScale(1.76, progressM);
      const sEarnings = capScale(1.76, earningsM);

      const heroX = -heroM.x;
      const heroY = -heroM.y;
      const ctaX = -ctaM.x;
      const ctaY = -ctaM.y;
      const progressX = -progressM.x;
      const progressY = -progressM.y;
      const earningsX = -earningsM.x;
      const earningsY = -earningsM.y;

      const tl = gsap.timeline({ paused: true });

      tl.fromTo(
        outer,
        { scale: 1 },
        { scale: sHero, duration: 1.3, ease: "power3.inOut" },
        0.9,
      );
      tl.fromTo(
        inner,
        { x: 0, y: 0 },
        { x: heroX, y: heroY, duration: 1.3, ease: "power3.inOut" },
        0.9,
      );

      tl.fromTo(
        eyebrow,
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
        0,
      );
      tl.fromTo(
        headline,
        { scale: 0, opacity: 0, y: 16 },
        { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        0.08,
      );
      tl.fromTo(
        plate,
        { scale: 0, opacity: 0, y: 24 },
        { scale: 1, opacity: 1, y: 0, duration: 0.62, ease: "power3.out" },
        0.1,
      );
      tl.fromTo(
        label1,
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.28,
      );

      tl.fromTo(
        label1,
        { scale: 1, opacity: 1, filter: "blur(0px)" },
        { scale: 1.2, opacity: 0.15, filter: "blur(10px)", duration: 0.2, ease: "power3.in", immediateRender: false },
        2.5,
      );
      tl.fromTo(
        outer,
        { scale: sHero },
        { scale: sCta, duration: 1.25, ease: "power3.inOut", immediateRender: false },
        2.7,
      );
      tl.fromTo(
        inner,
        { x: heroX, y: heroY },
        { x: ctaX, y: ctaY, duration: 1.25, ease: "power3.inOut", immediateRender: false },
        2.7,
      );
      tl.set(label1, { opacity: 0 }, 2.7);
      tl.set(label2, { opacity: 0.15, scale: 0.75, filter: "blur(10px)" }, 2.7);
      tl.fromTo(
        label2,
        { scale: 0.75, opacity: 0.15, filter: "blur(10px)" },
        { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out", immediateRender: false },
        2.7,
      );

      tl.fromTo(
        press,
        { scale: 1, backgroundColor: "rgba(255,255,255,0)" },
        { scale: 0.92, backgroundColor: "rgba(255,255,255,0.28)", duration: 0.16, ease: "power3.in" },
        4.08,
      );
      tl.fromTo(
        press,
        { scale: 0.92, backgroundColor: "rgba(255,255,255,0.28)" },
        { scale: 1, backgroundColor: "rgba(255,255,255,0)", duration: 0.52, ease: "power3.out", immediateRender: false },
        4.24,
      );
      tl.fromTo(
        burst,
        { scale: 1, opacity: 0 },
        { scale: 2.2, opacity: 0.5, duration: 0.42, ease: "power3.out" },
        4.24,
      );
      tl.fromTo(
        burst,
        { opacity: 0.5 },
        { opacity: 0, duration: 0.42, ease: "power3.in", immediateRender: false },
        4.66,
      );

      tl.fromTo(
        label2,
        { scale: 1, opacity: 1, filter: "blur(0px)" },
        { scale: 1.2, opacity: 0.15, filter: "blur(10px)", duration: 0.2, ease: "power3.in", immediateRender: false },
        5.8,
      );
      tl.fromTo(
        outer,
        { scale: sCta },
        { scale: sProgress, duration: 1.2, ease: "power3.inOut", immediateRender: false },
        6.0,
      );
      tl.fromTo(
        inner,
        { x: ctaX, y: ctaY },
        { x: progressX, y: progressY, duration: 1.2, ease: "power3.inOut", immediateRender: false },
        6.0,
      );
      tl.set(label2, { opacity: 0 }, 6.0);
      tl.set(label3, { opacity: 0.15, scale: 0.75, filter: "blur(10px)" }, 6.0);
      tl.fromTo(
        label3,
        { scale: 0.75, opacity: 0.15, filter: "blur(10px)" },
        { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out", immediateRender: false },
        6.0,
      );

      tl.fromTo(
        label3,
        { scale: 1, opacity: 1, filter: "blur(0px)" },
        { scale: 1.2, opacity: 0.15, filter: "blur(10px)", duration: 0.2, ease: "power3.in", immediateRender: false },
        8.3,
      );
      tl.fromTo(
        outer,
        { scale: sProgress },
        { scale: sEarnings, duration: 1.2, ease: "power3.inOut", immediateRender: false },
        8.5,
      );
      tl.fromTo(
        inner,
        { x: progressX, y: progressY },
        { x: earningsX, y: earningsY, duration: 1.2, ease: "power3.inOut", immediateRender: false },
        8.5,
      );
      tl.set(label3, { opacity: 0 }, 8.5);
      tl.set(label4, { opacity: 0.15, scale: 0.75, filter: "blur(10px)" }, 8.5);
      tl.fromTo(
        label4,
        { scale: 0.75, opacity: 0.15, filter: "blur(10px)", y: 0 },
        { scale: 1, opacity: 1, filter: "blur(0px)", y: 0, duration: 0.5, ease: "power3.out", immediateRender: false },
        8.5,
      );

      const idleStart = 9.82;
      const idleDur = 12.048 - idleStart;
      const cycles = idleDur / 2.2;
      const phase = { p: 0 };
      tl.fromTo(
        phase,
        { p: 0 },
        {
          p: Math.PI * 2 * cycles,
          duration: idleDur,
          ease: "none",
          immediateRender: false,
          onUpdate: function () {
            gsap.set(label4, { y: Math.sin(phase.p) * 2.5 });
          },
        },
        idleStart,
      );

      window.__timelines["03-referrer"] = tl;
      if (typeof window.__hfForceTimelineRebind === "function") {
        window.__hfForceTimelineRebind();
      }
    })();
