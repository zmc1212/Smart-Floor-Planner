  <div data-hf-id="hf-c864" id="root" data-composition-id="01-chain" data-width="1080" data-height="1920" data-duration="14.656">

    <div data-hf-id="hf-r7ep" id="01-chain-scene" class="clip" data-start="0" data-duration="14.656" data-track-index="1">

      <div data-hf-id="hf-dx96" id="01-chain-eyebrow">产品用途</div>

        <div data-hf-id="hf-ww51" id="01-chain-display"></div>

      <div data-hf-id="hf-ec72" id="01-chain-chips">

          </div>

      </div>
      </div>
    </div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    const DURATION = 14.256;
    const displayEl = document.getElementById("01-chain-display");
    const tokenEl = document.getElementById("01-chain-token");
    const lockupWrap = document.getElementById("01-chain-lockup-wrap");

    const DISPLAY_SEQ = [
      { t: 0, text: "" },
      { t: 1.15, text: "不是又一个工具" },
    ];
    const TOKEN_SEQ = [
      { t: 0, text: "" },
      { t: 3.65, text: "获客" },
      { t: 4.85, text: "量房" },
      { t: 6.05, text: "方案" },
      { t: 7.25, text: "交付" },
    ];

    function textAt(seq, time) {
      for (let i = seq.length - 1; i >= 0; i -= 1) {
        if (time >= seq[i].t) return seq[i].text;
      }
      return "";
    }

    const IDLE_START = 10.45;
    const IDLE_DUR = DURATION - IDLE_START;
    const CYCLES = IDLE_DUR / 2.4;
    const Y_AMP = 2.5;
    const SCALE_AMP = 0.01;

    const driver = { t: 0 };
    tl.fromTo(
      driver,
      { t: 0 },
      {
        t: DURATION,
        duration: DURATION,
        ease: "none",
        onUpdate: function () {
          const time = driver.t;
          const displayText = textAt(DISPLAY_SEQ, time);
          const tokenText = textAt(TOKEN_SEQ, time);
          if (displayEl.textContent !== displayText) displayEl.textContent = displayText;
          if (tokenEl.textContent !== tokenText) tokenEl.textContent = tokenText;
          if (time >= IDLE_START) {
            const phase = ((time - IDLE_START) / IDLE_DUR) * Math.PI * 2 * CYCLES;
            const wave = Math.sin(phase);
            lockupWrap.style.transform =
              "translateY(" + wave * Y_AMP + "px) scale(" + (1 + wave * SCALE_AMP) + ")";
          } else {
            lockupWrap.style.transform = "translateY(0px) scale(1)";
          }
        },
      },
      0,
    );

    const phoneEl = document.getElementById("01-chain-phone");
    const eyebrowEl = document.getElementById("01-chain-eyebrow");
    const lockupEl = document.getElementById("01-chain-lockup");

    tl.fromTo(
      phoneEl,
      { scale: 0.92, opacity: 0, y: 18 },
      { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
      0,
    );

    tl.fromTo(
      eyebrowEl,
      { scale: 0, opacity: 0, y: 8 },
      { scale: 1, opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
      0.12,
    );

    const CHIP_STAGGER = 0.06;
    [0, 1, 2, 3].forEach(function (index) {
      tl.fromTo(
        document.getElementById("01-chain-chip-" + index),
        { scale: 0, opacity: 0, y: 16 },
        { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        3.5 + index * CHIP_STAGGER,
      );
    });

    tl.fromTo(
      lockupEl,
      { scale: 0, opacity: 0, y: 12 },
      { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
      9.8,
    );

    window.__timelines["01-chain"] = tl;
  </script>
