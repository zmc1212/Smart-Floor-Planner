  <script>
    void (async function () {
      const shot = document.getElementById("02-customer-shot");
      await document.fonts.ready;
      if (shot && shot.decode) {
        try {
          await shot.decode();
        } catch (err) {}
      }

      const eyebrow = document.getElementById("02-customer-eyebrow");
      const headline = document.getElementById("02-customer-headline");
      const plate = document.getElementById("02-customer-plate");
      const outer = document.getElementById("02-customer-zoom-outer");
      const inner = document.getElementById("02-customer-zoom-inner");
      const hero = document.getElementById("02-customer-hero");
      const row1 = document.getElementById("02-customer-row1");
      const row2 = document.getElementById("02-customer-row2");
      const row3 = document.getElementById("02-customer-row3");
      const ticket = document.getElementById("02-customer-ticket");
      const cta = document.getElementById("02-customer-cta");
      const press = document.getElementById("02-customer-press");
      const burst = document.getElementById("02-customer-burst");
      const glow1 = document.getElementById("02-customer-glow-1");
      const glow2 = document.getElementById("02-customer-glow-2");
      const glow3 = document.getElementById("02-customer-glow-3");
      const labels = [1, 2, 3, 4, 5, 6].map(function (n) {
        return document.getElementById("02-customer-label-" + n);
      });

      function measure(el) {
        const view = plate.getBoundingClientRect();
        const r = el.getBoundingClientRect();
        return {
          x: r.left + r.width / 2 - (view.left + view.width / 2),
          y: r.top + r.height / 2 - (view.top + view.height / 2),
          w: r.width,
          h: r.height,
          vw: view.width,
          vh: view.height,
        };
      }

      function capScale(desired, m) {
        return Math.min(desired, (0.88 * m.vw) / m.w, (0.88 * m.vh) / m.h);
      }

      const heroM = measure(hero);
      const row1M = measure(row1);
      const row2M = measure(row2);
      const row3M = measure(row3);
      const ticketM = measure(ticket);
      const ctaM = measure(cta);

      const sHero = capScale(1.28, heroM);
      const sRow = capScale(1.72, row1M);
      const sRow2 = capScale(1.72, row2M);
      const sRow3 = capScale(1.72, row3M);
      const sTicket = capScale(1.58, ticketM);
      const sCta = capScale(2.05, ctaM);

      const heroX = -heroM.x;
      const heroY = -heroM.y;
      const row1X = -row1M.x;
      const row1Y = -row1M.y;
      const row2X = -row2M.x;
      const row2Y = -row2M.y;
      const row3X = -row3M.x;
      const row3Y = -row3M.y;
      const ticketX = -ticketM.x;
      const ticketY = -ticketM.y;
      const ctaX = -ctaM.x;
      const ctaY = -ctaM.y;

      const tl = gsap.timeline({ paused: true });

      function swapLabel(fromIdx, toIdx, at) {
        const from = labels[fromIdx];
        const to = labels[toIdx];
        tl.fromTo(
          from,
          { scale: 1, opacity: 1, filter: "blur(0px)" },
          { scale: 1.2, opacity: 0.15, filter: "blur(10px)", duration: 0.2, ease: "power3.in", immediateRender: false },
          at - 0.2,
        );
        tl.set(from, { opacity: 0 }, at);
        tl.set(to, { opacity: 0.15, scale: 0.75, filter: "blur(10px)" }, at);
        tl.fromTo(
          to,
          { scale: 0.75, opacity: 0.15, filter: "blur(10px)" },
          { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out", immediateRender: false },
          at,
        );
      }

      function panTo(fromS, toS, fromX, fromY, toX, toY, at, dur) {
        tl.fromTo(
          outer,
          { scale: fromS },
          { scale: toS, duration: dur, ease: "power3.inOut", immediateRender: false },
          at,
        );
        tl.fromTo(
          inner,
          { x: fromX, y: fromY },
          { x: toX, y: toY, duration: dur, ease: "power3.inOut", immediateRender: false },
          at,
        );
      }

      function keywordGlow(el, at) {
        tl.fromTo(
          el,
          { opacity: 0, boxShadow: "0 0 0 0 rgba(0,195,101,0)" },
          { opacity: 1, boxShadow: "0 0 28px 8px rgba(0,195,101,0.55)", duration: 0.28, ease: "power3.out" },
          at,
        );
        tl.fromTo(
          el,
          { opacity: 1, boxShadow: "0 0 28px 8px rgba(0,195,101,0.55)" },
          { opacity: 0.35, boxShadow: "0 0 12px 2px rgba(0,195,101,0.28)", duration: 0.7, ease: "power3.out", immediateRender: false },
          at + 0.28,
        );
      }

      tl.fromTo(outer, { scale: 1 }, { scale: sHero, duration: 1.2, ease: "power3.inOut" }, 0.8);
      tl.fromTo(inner, { x: 0, y: 0 }, { x: heroX, y: heroY, duration: 1.2, ease: "power3.inOut" }, 0.8);

      tl.fromTo(eyebrow, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo(
        headline,
        { scale: 0, opacity: 0, y: 16 },
        { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        0.08,
      );
      tl.fromTo(
        plate,
        { scale: 0.92, opacity: 0, y: 28, x: 36 },
        { scale: 1, opacity: 1, y: 0, x: 0, duration: 0.7, ease: "power3.out" },
        0.1,
      );
      tl.fromTo(labels[0], { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.28);

      swapLabel(0, 1, 2.4);
      panTo(sHero, sRow, heroX, heroY, row1X, row1Y, 2.4, 1.15);
      keywordGlow(glow1, 2.7);

      swapLabel(1, 2, 4.3);
      panTo(sRow, sRow2, row1X, row1Y, row2X, row2Y, 4.3, 1.05);
      keywordGlow(glow2, 4.55);

      swapLabel(2, 3, 6.2);
      panTo(sRow2, sRow3, row2X, row2Y, row3X, row3Y, 6.2, 1.05);
      keywordGlow(glow3, 6.45);

      swapLabel(3, 4, 8.2);
      panTo(sRow3, sTicket, row3X, row3Y, ticketX, ticketY, 8.2, 1.2);

      swapLabel(4, 5, 11.0);
      panTo(sTicket, sCta, ticketX, ticketY, ctaX, ctaY, 11.0, 1.1);

      tl.fromTo(
        press,
        { scale: 1, backgroundColor: "rgba(255,255,255,0)" },
        { scale: 0.92, backgroundColor: "rgba(255,255,255,0.28)", duration: 0.16, ease: "power3.in" },
        12.2,
      );
      tl.fromTo(
        press,
        { scale: 0.92, backgroundColor: "rgba(255,255,255,0.28)" },
        { scale: 1, backgroundColor: "rgba(255,255,255,0)", duration: 0.52, ease: "power3.out", immediateRender: false },
        12.36,
      );
      tl.fromTo(
        burst,
        { scale: 1, opacity: 0 },
        { scale: 2.2, opacity: 0.5, duration: 0.42, ease: "power3.out" },
        12.36,
      );
      tl.fromTo(
        burst,
        { opacity: 0.5 },
        { opacity: 0, duration: 0.42, ease: "power3.in", immediateRender: false },
        12.78,
      );

      const idleStart = 13.05;
      const idleDur = 14.088 - idleStart;
      const cycles = idleDur / 2.2;
      const phase = { p: 0 };
      tl.fromTo(
        phase,
        { p: 0 },
        {
          p: Math.PI * 2 * cycles,
          duration: idleDur,
          ease: "none",
          immediateRender: false,
          onUpdate: function () {
            gsap.set(labels[5], { y: Math.sin(phase.p) * 2.5 });
          },
        },
        idleStart,
      );

      window.__timelines["02-customer"] = tl;
    })();
  </script>
