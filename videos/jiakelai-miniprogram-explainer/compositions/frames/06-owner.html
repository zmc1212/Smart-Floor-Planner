  <script>
    window.__timelines = window.__timelines || {};

    (async function setupOwnerFrame() {
      if (document.fonts && document.fonts.ready) {
        await document.fonts.ready;
      }

      const plate = document.getElementById("06-owner-plate");
      const outer = document.getElementById("06-owner-zoom-outer");
      const inner = document.getElementById("06-owner-zoom-inner");
      const plateRect = plate.getBoundingClientRect();
      const PLATE_W = Math.max(plateRect.width, 1);
      const PLATE_H = Math.max(plateRect.height, 1);
      const WORLD_W = PLATE_W;
      const WORLD_H = PLATE_H;

      function fallbackFromPercent(leftPct, topPct, widthPct, heightPct) {
        const w = WORLD_W * widthPct;
        const h = WORLD_H * heightPct;
        const cx = WORLD_W * (leftPct + widthPct / 2);
        const cy = WORLD_H * (topPct + heightPct / 2);
        return {
          offsetX: cx - PLATE_W / 2,
          offsetY: cy - PLATE_H / 2,
          width: w,
          height: h,
        };
      }

      function measureTarget(el, fallback) {
        const vr = plate.getBoundingClientRect();
        const r = el.getBoundingClientRect();
        if (r.width > 1 && vr.width > 1) {
          return {
            offsetX: r.left + r.width / 2 - (vr.left + vr.width / 2),
            offsetY: r.top + r.height / 2 - (vr.top + vr.height / 2),
            width: r.width,
            height: r.height,
          };
        }
        return fallback;
      }

      function capScale(desired, measured) {
        const maxScale = Math.min(
          (0.88 * PLATE_W) / Math.max(measured.width, 1),
          (0.88 * PLATE_H) / Math.max(measured.height, 1),
        );
        return Math.min(desired, Math.max(1, maxScale));
      }

      const share = measureTarget(
        document.getElementById("06-owner-target-share"),
        fallbackFromPercent(0.08, 0.262, 0.41, 0.1),
      );
      const invite = measureTarget(
        document.getElementById("06-owner-target-invite"),
        fallbackFromPercent(0.51, 0.262, 0.41, 0.1),
      );
      const priority = measureTarget(
        document.getElementById("06-owner-target-priority"),
        fallbackFromPercent(0.1, 0.81, 0.72, 0.082),
      );

      const shareS = capScale(2.15, share);
      const inviteS = capScale(2.15, invite);
      const priorityS = capScale(1.55, priority);

      const shareX = -share.offsetX;
      const shareY = -share.offsetY;
      const inviteX = -invite.offsetX;
      const inviteY = -invite.offsetY;
      const priorityX = -priority.offsetX;
      const priorityY = -priority.offsetY;

      const tl = gsap.timeline({ paused: true });

      function popIn(el, at, dur, yRise) {
        tl.fromTo(
          el,
          { scale: 0, opacity: 0, y: yRise },
          { scale: 1, opacity: 1, y: 0, duration: dur, ease: "power3.out" },
          at,
        );
      }

      function fadeTo(el, at, dur, fromOp, toOp) {
        tl.fromTo(
          el,
          { opacity: fromOp },
          { opacity: toOp, duration: dur, ease: "power3.out", immediateRender: false },
          at,
        );
      }

      function zoomTo(at, dur, fromScale, toScale, fromX, toX, fromY, toY) {
        tl.fromTo(
          outer,
          { scale: fromScale },
          { scale: toScale, duration: dur, ease: "power3.inOut", immediateRender: false },
          at,
        );
        tl.fromTo(
          inner,
          { x: fromX, y: fromY },
          { x: toX, y: toY, duration: dur, ease: "power3.inOut", immediateRender: false },
          at,
        );
      }

      popIn(document.getElementById("06-owner-eyebrow"), 0.0, 0.48, 12);
      popIn(document.getElementById("06-owner-headline"), 0.08, 0.5, 16);
      popIn(plate, 0.0, 0.5, 24);
      popIn(document.getElementById("06-owner-callout-1"), 0.22, 0.42, 10);

      fadeTo(document.getElementById("06-owner-target-capsules"), 0.4, 0.35, 0, 1);
      fadeTo(document.getElementById("06-owner-target-capsules"), 2.35, 0.25, 1, 0);

      fadeTo(document.getElementById("06-owner-callout-1"), 2.45, 0.2, 1, 0);
      popIn(document.getElementById("06-owner-callout-2"), 2.6, 0.42, 10);
      fadeTo(document.getElementById("06-owner-target-share"), 2.6, 0.3, 0, 1);
      zoomTo(2.6, 1.15, 1, shareS, 0, shareX, 0, shareY);

      fadeTo(document.getElementById("06-owner-callout-2"), 4.7, 0.18, 1, 0);
      fadeTo(document.getElementById("06-owner-target-share"), 4.7, 0.18, 1, 0);
      popIn(document.getElementById("06-owner-callout-3"), 4.85, 0.42, 10);
      fadeTo(document.getElementById("06-owner-target-invite"), 4.85, 0.3, 0, 1);
      zoomTo(4.85, 1.15, shareS, inviteS, shareX, inviteX, shareY, inviteY);

      fadeTo(document.getElementById("06-owner-callout-3"), 6.85, 0.18, 1, 0);
      fadeTo(document.getElementById("06-owner-target-invite"), 6.85, 0.18, 1, 0);
      popIn(document.getElementById("06-owner-callout-4"), 7.0, 0.42, 10);
      fadeTo(document.getElementById("06-owner-target-priority"), 7.0, 0.3, 0, 1);
      zoomTo(7.0, 1.15, inviteS, priorityS, inviteX, priorityX, inviteY, priorityY);

      fadeTo(document.getElementById("06-owner-callout-4"), 9.05, 0.22, 1, 0);
      fadeTo(document.getElementById("06-owner-target-priority"), 9.05, 0.22, 1, 0);
      zoomTo(9.2, 1.2, priorityS, 1, priorityX, 0, priorityY, 0);

      popIn(document.getElementById("06-owner-lockup"), 9.32, 0.55, 12);

      fadeTo(plate, 12.15, 0.9, 1, 0.82);
      fadeTo(document.getElementById("06-owner-headline"), 12.15, 0.9, 1, 0.72);

      window.__timelines["06-owner"] = tl;
    })();
  </script>
